databases:
  - name: api-sentinel-db
    databaseName: api_sentinel
    user: api_sentinel_user
    plan: free
    region: singapore

services:
  - type: web
    name: api-sentinel
    env: node
    plan: free
    region: singapore
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && npm install && npx prisma db push && npm run seed"
    startCommand: "cd backend && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-sentinel-db
          property: connectionString
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        value: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
