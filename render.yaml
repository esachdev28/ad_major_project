databases:
  - name: api-sentinel-db
    databaseName: api_sentinel
    user: api_sentinel_user
    plan: free
    region: singapore

services:
  - type: web
    name: api-sentinel
    env: node
    plan: free
    region: singapore
    buildCommand: "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install && npx prisma generate"
    startCommand: "cd backend && npx prisma db push && node prisma/seed.js && node server.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-sentinel-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        value: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
